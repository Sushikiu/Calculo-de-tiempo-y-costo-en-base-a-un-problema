<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Alumnos - Academia</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 24px; border: 1px solid #e2e8f0; border-radius: 12px; }
    h2 { margin-top: 0; color: #1e293b; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #alerta { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <h2>🎓 Registro de Nuevo Alumno</h2>
  
  <form id="registroForm">
    <label>Nombre completo</label>
    <input type="text" id="nombre" required placeholder="Ej. Sopas Mango">

    <label>Correo electrónico</label>
    <input type="email" id="email" required placeholder="sopas@ejemplo.com">

    <label>Teléfono</label>
    <input type="text" id="telefono" required placeholder="5512345678">

    <label>Idioma nativo</label>
    <input type="text" id="idiomaNativo" required placeholder="Español">

    <label>Idioma por aprender</label>
    <select id="idiomaAprender">
      <option value="Inglés">Inglés</option>
      <option value="Francés">Francés</option>
      <option value="Alemán">Alemán</option>
      <option value="Italiano">Italiano</option>
    </select>

    <label>Número de Tarjeta (Pago Predeterminado)</label>
    <input type="text" id="tarjeta" required placeholder="4152 0000 0000 1234">

    <button type="submit">Inscribir Alumno</button>
  </form>

  <div id="alerta"></div>

  <script>
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const datosAlumno = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        telefono: document.getElementById('telefono').value,
        idiomaNativo: document.getElementById('idiomaNativo').value,
        idiomaAprender: document.getElementById('idiomaAprender').value,
        nivel: 1,
        medioPagoDefault: {
          numeroTarjeta: document.getElementById('tarjeta').value,
          titular: document.getElementById('nombre').value
        }
      };

      const alerta = document.getElementById('alerta');

      try {
        const respuesta = await fetch('/api/alumnos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datosAlumno)
        });

        const resultado = await respuesta.json();

        if (respuesta.ok) {
          alerta.style.display = 'block';
          alerta.style.background = '#dcfce7';
          alerta.style.color = '#15803d';
          alerta.innerText = 'Alumno registrado exitosamente';
          document.getElementById('registroForm').reset();
        } else {
          throw new Error(resultado.error);
        }
      } catch (err) {
        alerta.style.display = 'block';
        alerta.style.background = '#fee2e2';
        alerta.style.color = '#b91c1c';
        alerta.innerText = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
