<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción de Alumnos | Academia de Idiomas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #166534;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 560px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.02);
      padding: 36px 32px;
    }

    .header {
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      background: #eff6ff;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin: 24px 0 14px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full-width {
      grid-column: span 2;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #334155;
    }

    input, select {
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #fff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .checkbox-container input {
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .checkbox-text {
      display: flex;
      flex-direction: column;
    }

    .checkbox-text span:first-child {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .checkbox-text span:last-child {
      font-size: 12px;
      color: var(--text-muted);
    }

    #campoMatricula {
      display: none;
      margin-top: 10px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button[type="submit"] {
      font-family: inherit;
      width: 100%;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 28px;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button[type="submit"]:hover {
      background: var(--primary-hover);
    }

    button[type="submit"]:active {
      transform: scale(0.99);
    }

    .alert {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .alert.success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .alert.error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .credential-box {
      margin-top: 10px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid var(--success-border);
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge">Portal de admisiones</span>
      <h1>Inscripción de alumno</h1>
      <p>Ingresa los datos del nuevo estudiante para generar su matrícula y cuenta de acceso.</p>
    </div>

    <form id="registroForm">
      <div class="section-title">Información personal</div>
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required placeholder="Ej. Sopas Mango Ataulfo">
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required placeholder="sopas@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono de contacto</label>
          <input type="tel" id="telefono" required placeholder="55 1234 5678">
        </div>
      </div>

      <div class="section-title">Programa académico</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="idiomaNativo">Idioma materno</label>
          <input type="text" id="idiomaNativo" required placeholder="Español">
        </div>
        <div class="form-group">
          <label for="idiomaAprender">Idioma a cursar</label>
          <select id="idiomaAprender">
            <option value="Inglés">Inglés</option>
            <option value="Francés">Francés</option>
            <option value="Alemán">Alemán</option>
            <option value="Italiano">Italiano</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label for="quienRecomendo">¿Quién te recomendó? <span style="font-weight: 400; color: var(--text-muted);">(Opcional)</span></label>
          <input type="text" id="quienRecomendo" placeholder="Nombre completo del referente">
        </div>
      </div>

      <div class="section-title">Beneficios & Pago</div>
      <div class="form-grid">
        <div class="form-group full-width">
          <label class="checkbox-container">
            <input type="checkbox" id="familiarInscrito">
            <div class="checkbox-text">
              <span>Familiar previamente inscrito</span>
              <span>Aplica un 5% de descuento directo en las colegiaturas sucesivas.</span>
            </div>
          </label>
        </div>

        <div class="form-group full-width" id="campoMatricula">
          <label for="matriculaFamiliar">Matrícula del familiar</label>
          <input type="text" id="matriculaFamiliar" placeholder="Ej. ALUM-2026-004">
        </div>

        <div class="form-group full-width">
          <label for="tarjeta">Número de tarjeta para cargos automáticos</label>
          <input type="text" id="tarjeta" required placeholder="•••• •••• •••• ••••" maxlength="19">
        </div>
      </div>

      <button type="submit" id="btnSubmit">Completar registro</button>
    </form>

    <div id="alerta" class="alert"></div>
  </div>

  <script>
    const checkboxFamiliar = document.getElementById('familiarInscrito');
    const campoMatricula = document.getElementById('campoMatricula');
    const inputMatricula = document.getElementById('matriculaFamiliar');
    const alerta = document.getElementById('alerta');
    const btnSubmit = document.getElementById('btnSubmit');

    checkboxFamiliar.addEventListener('change', (e) => {
      campoMatricula.style.display = e.target.checked ? 'block' : 'none';
      if (!e.target.checked) inputMatricula.value = '';
    });

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Guardado';

      const familiarActivo = checkboxFamiliar.checked;
      const datosAlumno = {
        nombre: document.getElementById('nombre').value.trim(),
        email: document.getElementById('email').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        idiomaNativo: document.getElementById('idiomaNativo').value.trim(),
        idiomaAprender: document.getElementById('idiomaAprender').value,
        quienRecomendo: document.getElementById('quienRecomendo').value.trim() || null,
        familiarInscrito: familiarActivo,
        matriculaFamiliar: familiarActivo ? inputMatricula.value.trim() : null,
        nivel: 1,
        medioPagoDefault: {
          numeroTarjeta: document.getElementById('tarjeta').value.trim(),
          titular: document.getElementById('nombre').value.trim()
        }
      };

      try {
        const respuesta = await fetch('/api/alumnos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datosAlumno)
        });

        const resultado = await respuesta.json();

        if (respuesta.ok) {
          const usuarioGenerado = datosAlumno.email.split('@')[0];
          const passGenerado = 'Temp.' + Math.floor(1000 + Math.random() * 9000);

          alerta.className = 'alert success';
          alerta.style.display = 'block';
          alerta.innerHTML = `
            <strong>Registro completado con éxito.</strong> El alumno fue dado de alta en la base de datos.<br>
            <div class="credential-box">
              <strong>Credenciales provisionales generadas:</strong><br>
              Usuario: ${usuarioGenerado}<br>
              Contraseña: ${passGenerado}
            </div>
          `;
          document.getElementById('registroForm').reset();
          campoMatricula.style.display = 'none';
        } else {
          throw new Error(resultado.error || 'Error al procesar la inscripción');
        }
      } catch (err) {
        alerta.className = 'alert error';
        alerta.style.display = 'block';
        alerta.innerText = 'Error: ' + err.message;
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Completar registro';
      }
    });
  </script>
</body>
</html>
